<!-- ====== WaterFlush — Bandeau Récompenses & Distinctions ====== -->
<div class="wf-awards-root">
<style>
/* Pas d'import de police : le bandeau reprend celle du site. */

.wf-awards-root{
  --wf-blue-deep:#153A5B;
  --wf-navy:#16294A;
  --wf-blue-mid:#2D74AC;
  --wf-turq:#33C7D8;
  --wf-ink:#181B1E;
  --wf-muted:#4B6478;
  --wf-border:rgba(21,58,91,.14);
  --wf-font:'DM Sans','Inter','Plus Jakarta Sans','Poppins','Montserrat',
            ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  font-family:var(--wf-font);
  color:var(--wf-ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wf-awards-root,
.wf-awards-root *,
.wf-awards-root *::before,
.wf-awards-root *::after{ box-sizing:border-box; }

.wf-awards{
  position:relative;
  margin:0;
  padding:clamp(2.6rem,5vw,4rem) 0 clamp(2.4rem,4.5vw,3.4rem);
  background:#FFFFFF;
  overflow:hidden;
}

/* ---------- Titre ---------- */
.wf-awards-head{
  max-width:46rem;
  margin:0 auto clamp(2rem,3.6vw,2.8rem);
  padding:0 1.25rem;
  text-align:center;
}
.wf-awards-head .wf-eyebrow{
  display:inline-flex; align-items:center; gap:.5rem;
  font-weight:800; font-size:.85rem; letter-spacing:.06em; text-transform:uppercase;
  color:var(--wf-blue-mid);
  margin:0 0 .85rem;
}
.wf-awards-head .wf-eyebrow::before,
.wf-awards-head .wf-eyebrow::after{
  content:""; display:block; width:28px; height:2px; border-radius:2px;
  background:linear-gradient(90deg, transparent, var(--wf-turq));
}
.wf-awards-head .wf-eyebrow::after{ background:linear-gradient(90deg, var(--wf-turq), transparent); }
.wf-awards-head h2{
  font-family:var(--wf-font);
  font-weight:700;
  font-size:clamp(1.55rem,2.9vw,2.1rem);
  line-height:1.2;
  letter-spacing:-.01em;
  color:var(--wf-navy);
  margin:0;
  text-wrap:balance;
}
.wf-awards-head p{
  margin:.9rem auto 0;
  max-width:36em;
  font-size:1.03rem;
  color:var(--wf-muted);
}

/* ---------- Tapis déroulant ---------- */
.wf-aw-marquee{
  position:relative;
  overflow:hidden;
  padding:.4rem 0 .2rem;
  -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%);
          mask-image:linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%);
}
.wf-aw-track{
  display:flex;
  width:max-content;
  animation:wf-aw-scroll 42s linear infinite;
}
.wf-aw-marquee:hover .wf-aw-track,
.wf-aw-marquee:focus-within .wf-aw-track{ animation-play-state:paused; }
@keyframes wf-aw-scroll{
  from{ transform:translate3d(0,0,0); }
  to{ transform:translate3d(-25%,0,0); }
}
@media (prefers-reduced-motion: reduce){
  .wf-aw-track{ animation-duration:320s; }
}
.wf-aw-seq{ display:flex; align-items:flex-start; flex:none; }

/* ---------- Carte ---------- */
.wf-aw-card{
  flex:none;
  width:clamp(190px,21vw,236px);
  margin:0 clamp(.5rem,1.1vw,.85rem);
  padding:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}
.wf-aw-tile{
  width:100%;
  height:clamp(124px,13vw,150px);
  display:flex; align-items:center; justify-content:center;
  padding:1rem 1.1rem;
  background:#fff;
  border:1px solid var(--wf-border);
  border-radius:18px;
  box-shadow:0 2px 4px rgba(21,58,91,.04), 0 10px 24px -14px rgba(21,58,91,.28);
  transition:transform .35s ease, box-shadow .35s ease, border-color .35s ease;
}
.wf-aw-card:hover .wf-aw-tile{
  transform:translateY(-4px);
  border-color:rgba(51,199,216,.55);
  box-shadow:0 3px 6px rgba(21,58,91,.05), 0 18px 34px -16px rgba(21,58,91,.34);
}
.wf-aw-logo{
  width:100%;
  height:100%;
  background-repeat:no-repeat;
  background-position:center;
  background-size:contain;
}
.wf-aw-card--photo .wf-aw-tile{ padding:0; overflow:hidden; }

.wf-aw-card figcaption{
  margin-top:.85rem;
  display:flex;
  flex-direction:column;
  gap:.18rem;
  padding:0 .2rem;
}
.wf-aw-title{
  font-family:var(--wf-font);
  font-weight:700;
  font-size:.95rem;
  line-height:1.3;
  color:var(--wf-navy);
  text-wrap:balance;
}
.wf-aw-sub{
  font-size:.82rem;
  line-height:1.35;
  color:var(--wf-muted);
  text-wrap:balance;
}

@media (max-width:640px){
  .wf-aw-card{ width:168px; }
  .wf-aw-tile{ height:112px; padding:.85rem; border-radius:15px; }
  .wf-aw-title{ font-size:.9rem; }
  .wf-aw-sub{ font-size:.77rem; }
  .wf-aw-track{ animation-duration:34s; }
}
