<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bandeau Récompenses</title>
<style>
  :root{ color-scheme:light; }
  html,body{ margin:0; background:#fff; }
  body{ font-family:'DM Sans', ui-sans-serif, system-ui, -apple-system, sans-serif; }
  .wf-demo-note{
    max-width:46rem; margin:0 auto; padding:1.6rem 1.25rem .4rem;
    text-align:center; color:#4B6478; font-size:.86rem;
  }
</style>
</head>
<body>
<!-- ====== WaterFlush — Bandeau Récompenses & Distinctions ====== -->
<div class="wf-awards-root">
<style>
/* Pas d'import de police : le bandeau reprend celle du site. */

.wf-awards-root{
  --wf-navy:#16294A;
  --wf-blue-mid:#2D74AC;
  --wf-turq:#33C7D8;
  --wf-ink:#181B1E;
  --wf-muted:#4B6478;
  --wf-border:rgba(21,58,91,.13);
  --wf-font:'DM Sans','Inter','Plus Jakarta Sans','Poppins','Montserrat',
            ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  font-family:var(--wf-font);
  color:var(--wf-ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wf-awards-root,
.wf-awards-root *,
.wf-awards-root *::before,
.wf-awards-root *::after{ box-sizing:border-box; }

.wf-awards{
  position:relative;
  margin:0;
  padding:clamp(2.6rem,5vw,4rem) 0 clamp(2.6rem,5vw,3.8rem);
  background:#FFFFFF;
}

/* ---------- Titre ---------- */
.wf-awards-head{
  max-width:46rem;
  margin:0 auto clamp(1.9rem,3.4vw,2.6rem);
  padding:0 1.25rem;
  text-align:center;
}
.wf-awards-head .wf-eyebrow{
  display:inline-flex; align-items:center; gap:.5rem;
  font-weight:700; font-size:.82rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--wf-blue-mid);
  margin:0 0 .8rem;
}
.wf-awards-head .wf-eyebrow::before,
.wf-awards-head .wf-eyebrow::after{
  content:""; display:block; width:26px; height:2px; border-radius:2px;
  background:linear-gradient(90deg, transparent, var(--wf-turq));
}
.wf-awards-head .wf-eyebrow::after{ background:linear-gradient(90deg, var(--wf-turq), transparent); }
.wf-awards-head h2{
  font-family:var(--wf-font);
  font-weight:700;
  font-size:clamp(1.55rem,2.9vw,2.1rem);
  line-height:1.2;
  letter-spacing:-.01em;
  color:var(--wf-navy);
  margin:0;
  text-wrap:balance;
}
.wf-awards-head p{
  margin:.85rem auto 0;
  max-width:36em;
  font-size:1rem;
  color:var(--wf-muted);
}

/* ---------- Le filet : un seul bandeau continu ---------- */
.wf-aw-frame{
  max-width:1180px;
  margin:0 auto;
  padding:0 clamp(1rem,3vw,1.5rem);
}
.wf-aw-band{
  position:relative;
  border:1px solid var(--wf-border);
  border-radius:20px;
  background:#FFFFFF;
  box-shadow:0 1px 2px rgba(21,58,91,.03), 0 14px 34px -22px rgba(21,58,91,.30);
  overflow:hidden;
}
.wf-aw-marquee{
  position:relative;
  overflow:hidden;
  padding:clamp(1.5rem,2.6vw,2rem) 0;
  -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 6%, #000 94%, transparent 100%);
          mask-image:linear-gradient(90deg, transparent 0, #000 6%, #000 94%, transparent 100%);
}
.wf-aw-track{
  display:flex;
  width:max-content;
  animation:wf-aw-scroll 46s linear infinite;
}
.wf-aw-band:hover .wf-aw-track,
.wf-aw-band:focus-within .wf-aw-track{ animation-play-state:paused; }
@keyframes wf-aw-scroll{
  from{ transform:translate3d(0,0,0); }
  to{ transform:translate3d(-25%,0,0); }
}
@media (prefers-reduced-motion: reduce){
  .wf-aw-track{ animation-duration:340s; }
}
.wf-aw-seq{ display:flex; align-items:stretch; flex:none; }

/* ---------- Une récompense ---------- */
.wf-aw-item{
  position:relative;
  flex:none;
  width:clamp(196px,22vw,250px);
  margin:0;
  padding:0 clamp(1.1rem,2.2vw,1.8rem);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
/* séparateur discret entre chaque récompense */
.wf-aw-item::before{
  content:"";
  position:absolute;
  left:0; top:8%; bottom:8%;
  width:1px;
  background:linear-gradient(180deg, transparent, var(--wf-border) 22%, var(--wf-border) 78%, transparent);
}
.wf-aw-logo{
  width:100%;
  height:clamp(76px,8.4vw,94px);
  background-repeat:no-repeat;
  background-position:center;
  background-size:contain;
}
.wf-aw-item--wide .wf-aw-logo{ height:clamp(80px,8.8vw,98px); }

.wf-aw-item figcaption{
  margin-top:.95rem;
  display:flex;
  flex-direction:column;
  gap:.2rem;
}
.wf-aw-title{
  font-weight:700;
  font-size:.93rem;
  line-height:1.3;
  color:var(--wf-navy);
  text-wrap:balance;
}
.wf-aw-sub{
  font-size:.8rem;
  line-height:1.4;
  color:var(--wf-muted);
  text-wrap:balance;
}

@media (max-width:640px){
  .wf-aw-frame{ padding:0 1rem; }
  .wf-aw-band{ border-radius:16px; }
  .wf-aw-item{ width:176px; padding:0 1rem; }
  .wf-aw-logo{ height:68px; }
  .wf-aw-item--wide .wf-aw-logo{ height:72px; }
  .wf-aw-item figcaption{ margin-top:.8rem; }
  .wf-aw-title{ font-size:.87rem; }
  .wf-aw-sub{ font-size:.76rem; }
  .wf-aw-track{ animation-duration:36s; }
}
